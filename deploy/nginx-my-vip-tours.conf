# /etc/nginx/sites-available/my-vip-tours — static site, next to TaxiApp on the same server.
# HTTPS lines are added by certbot (see deploy/install.sh).
server {
    listen 80;
    server_name my-vip-tours.com www.my-vip-tours.com;
    root /var/www/my-vip-tours/current;

    # one canonical host: www -> bare domain (certbot keeps this when it adds HTTPS)
    if ($host = www.my-vip-tours.com) { return 301 $scheme://my-vip-tours.com$request_uri; }

    index index.html;
    error_page 404 /404.html;
    charset utf-8;

    location / {
        # one URL per page: no trailing slash, no .html (the 404 page is served
        # from its own exact location below, so it never passes through these)
        rewrite ^/(.+)/$ /$1 permanent;
        rewrite ^/index(\.html)?$ / permanent;
        rewrite ^/(.+)\.html$ /$1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /404.html { internal; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
